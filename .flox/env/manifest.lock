    "hook": {
      "on-activate": "  # Set *_INSTALL_PREFIX vars to nix store paths so CMakeLists.txt\n  # can find dependencies via its custom env-var-based lookup logic.\n  # $FLOX_ENV is a symlink tree that merges all installed packages.\n  export ZLIB_INSTALL_PREFIX=\"$FLOX_ENV\"\n  export OPENSSL_INSTALL_PREFIX=\"$FLOX_ENV\"\n  export CURL_INSTALL_PREFIX=\"$FLOX_ENV\"\n  # PYBIND11: using submodule for now (has custom patches)\n\n  # BLAS: CMakeLists.txt looks for libblas.a but openblas provides libblas.so\n  # Point BLAS_LIBRARIES directly at the shared library.\n  export BLAS_LIBRARIES=\"$FLOX_ENV/lib/libblas.so\"\n\n  # Once packages are uncommented in [install], they merge into $FLOX_ENV.\n  export LLVM_INSTALL_PREFIX=\"$FLOX_ENV\"\n  export CUQUANTUM_INSTALL_PREFIX=\"$FLOX_ENV\"\n  export CUTENSOR_INSTALL_PREFIX=\"$FLOX_ENV\"\n  export AWS_INSTALL_PREFIX=\"$FLOX_ENV\"\n  export QRMI_INSTALL_PREFIX=\"$FLOX_ENV\"\n\n  # Ensure cmake can find packages in the flox environment\n  export CMAKE_PREFIX_PATH=\"$FLOX_ENV:${CMAKE_PREFIX_PATH:-}\"\n"
    },
    "profile": {},
    "options": {
      "allow": {
        "unfree": true
      }
    }
  },
