# RUN: %cudaq-target-db-gen -o %t.db.cpp v2-phys-defaults=%S/v2-physical-profile-defaults.yml
# RUN: FileCheck %s --input-file=%t.db.cpp

# Omitted profile options take their defaults, and an omitted lowering maps to
# the default (inferred) lowering - never to an empty custom pipeline.

version: 2
name: v2-phys-defaults
description: "Physical profile defaults and omitted lowering"
config:
  library-mode: false

compile-target:
  stages:
    - ir-output-profile:
        name: physical-quake
  codegen: nop

# CHECK: .irOutputProfile = cudaq::config::Profile{std::in_place_type<cudaq::config::PhysicalQuakeProfile>, cudaq::config::PhysicalQuakeProfile{.basisGates = {}, .measurements = cudaq::config::MeasurementForm::any, .resetBeforeReuse = false}
# CHECK: .lowering = cudaq::config::DefaultLowering{}
